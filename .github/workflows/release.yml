name: Release

# Pushing a tag such as v0.2.0 builds the plugin and publishes a GitHub
# release with the .xpi attached. Zotero finds it through updates.json on main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Check that updates.json lists this version
        run: node -e "const u=require('./updates.json').addons['oscola-check@check-entry-zotero'].updates; if(!u.some(x=>'v'+x.version===process.env.GITHUB_REF_NAME)){console.error('updates.json has no entry for '+process.env.GITHUB_REF_NAME);process.exit(1)}"
      - run: npm run check
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.xpi
          generate_release_notes: true
