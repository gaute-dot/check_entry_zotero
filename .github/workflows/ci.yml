name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tesseract and poppler (for the OCR test)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng poppler-utils
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: oscola-check-xpi
          path: build/*.xpi
